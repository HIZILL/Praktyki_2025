<h2>🔐 Logowanie</h2>
<form (ngSubmit)="login()">
  <label>Login: <input [(ngModel)]="username" name="username" required></label><br>
  <label>Hasło: <input [(ngModel)]="password" name="password" type="password" required></label><br>
  <button type="submit">Zaloguj</button>
  <p *ngIf="error" style="color:red">{{ error }}</p>
</form>
