<div class="container mt-5">
  <h2 class="text-center mb-4">📊 Statystyki gracza: {{ username }}</h2>

  <div class="w-100 w-md-75 mx-auto">
    <div *ngIf="scores.length; else brakWynikow">
      <p class="fw-bold">Najlepsze wyniki:</p>
      <ul class="list-group mb-3">
        <li *ngFor="let score of scores" class="list-group-item">
          🎮 Tryb: {{ score.mode }} –
          {{ score.score }} pkt –
          ❤️ Życia: {{ score.lives }} –
          ⏱️ Limit: {{ score.timeLimit }}s –
          🌎 Region: {{ score.region }} –
          🕒 {{ score.timestamp | date:'yyyy-MM-dd, HH:mm' }}
        </li>
      </ul>
      <button class="btn btn-danger me-2" (click)="clearScores()">🗑️ Wyczyść wyniki</button>
    </div>

    <ng-template #brakWynikow>
      <p class="text-muted">Brak zapisanych wyników.</p>
    </ng-template>

    <div class="mt-3">
      <button class="btn btn-secondary" (click)="goToMenu()">🏠 Wróć do menu</button>
    </div>
  </div>
</div>
